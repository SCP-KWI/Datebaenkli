<!doctype html>
<html lang="de" data-app="datebaenkli">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="password.title">Passwort ändern — Datebänkli</title>
    <link rel="preload" href="/assets/fonts/source-sans-3-400-latin.woff2" as="font"
          type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/material-symbols-rounded-400.woff2" as="font"
          type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/fonts.css" />
    <link rel="stylesheet" href="/assets/chalk-tokens.css" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script src="/assets/theme.js"></script>
  </head>
  <body data-page="auth">
    <!--
      Translated properly rather than bilingually, unlike `login.html`: this page
      is *not* pre-auth. It fetches `/api/me` below, so `app_user.locale` is known
      by the time anything renders.

      There is deliberately no language <select> here. `PATCH /api/me` carries no
      `passwordChangeExempt` (routes/session.ts), so a user held on this page by
      the forced-change gate would get a 403 from the switch — a control that
      silently fails is worse than no control, and the page after this one has
      one. The locale still applies; it just cannot be changed from here.
    -->
    <div class="auth card">
      <div class="brand-stack">
        <span class="brand-badge mi" aria-hidden="true">key</span>
        <h1 data-i18n="password.heading">Passwort ändern</h1>
      </div>
      <p class="muted small" id="why" data-i18n="password.rule">Mindestens 10 Zeichen.</p>

      <form id="form">
        <label for="current" data-i18n="password.current">Aktuelles Passwort</label>
        <input id="current" autocomplete="current-password" name="current" type="password" required autofocus />

        <label for="next" data-i18n="password.next">Neues Passwort</label>
        <input id="next" autocomplete="new-password" name="next" type="password" required minlength="10" />

        <label for="repeat" data-i18n="password.repeat">Neues Passwort wiederholen</label>
        <input id="repeat" autocomplete="new-password" name="repeat" type="password" required minlength="10" />

        <button type="submit" class="primary" data-i18n="password.save">Speichern</button>
      </form>
      <p id="error" role="alert" class="banner banner-bad"></p>
    </div>

    <footer class="footer">
      <span class="footer-version" id="version"></span>
      <span class="footer-contact"><span data-i18n="footer.contact">Fragen oder Probleme:</span>
        <a href="mailto:philip.schaffner@kwi.ch">philip.schaffner@kwi.ch</a></span>
    </footer>

    <script type="module" src="/assets/password.js"></script>
  </body>
</html>
